<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter | Pabsmophobia</title>

  <link rel="icon" type="image/jpeg" href="images/library/Pabsmo.jpg">
  <link rel="apple-touch-icon" href="images/library/Pabsmo.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Eczar:wght@400;600&amp;display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="styles.css?v=1.3">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/library/Pabsmo.jpg" alt="Pabsmophobia Logo" class="logo-img">
      <span>Pabsmophobia</span>
    </div>
    <nav></nav>
  </header>

  <main class="container">
    <a href="blog.html" class="read-more" style="display: inline-block; margin-bottom: 1.5rem;">← Back to Blogs &amp; Newsletters</a>
    
    <article id="markdown-content" class="article-card">
      <p style="color: var(--text-muted, #888);">Loading article...</p>
    </article>
  </main>

  <footer>
    <p>© Pabsmophobia. All rights reserved.</p>
  </footer>

  <script>
    async function loadArticle() {
      const contentContainer = document.getElementById('markdown-content');
      const urlParams = new URLSearchParams(window.location.search);
      
      // urlParams.get() already handles URL decoding automatically
      let fileParam = urlParams.get('file');

      if (!fileParam) {
        fileParam = 'monthly-haunt-issue1.md';
      }

      // Cleanup trailing ports or accidental prefixing
      fileParam = fileParam.trim().replace(/:\d+$/, '').replace(/^\/+/, '').replace(/^newsletter\//, '');

      // Explicit relative pathing for Cloudflare Pages
      const pathsToTry = [
        `./newsletter/${fileParam}`,
        `./newsletter/${fileParam.toLowerCase()}`,
        `./newsletter/${fileParam.replace(/-/g, '_')}`,
        `./newsletter/${fileParam.replace(/_/g, '-')}`
      ];

      let response = null;

      for (const path of pathsToTry) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            response = res;
            break;
          }
        } catch (e) {
          // Continue trying backup path variations
        }
      }

      if (!response) {
        contentContainer.innerHTML = `
          <div style="padding: 2rem; text-align: center;">
            <p style="color: #ff5555; font-size: 1.2rem; font-weight: bold;">Error loading article.</p>
            <p>Could not locate file: <code>newsletter/${fileParam}</code></p>
            <p style="font-size: 0.9rem; color: #aaa;">Please verify the exact filename case inside your <strong>newsletter/</strong> folder.</p>
          </div>
        `;
        return;
      }

      try {
        const rawText = await response.text();
        
        // Extract title from YAML frontmatter if available
        let titleMatch = rawText.match(/^title:\s*["']?(.*?)["']?\s*$/m);
        let extractedTitle = titleMatch ? titleMatch[1] : null;

        // Strip YAML frontmatter block
        const cleanText = rawText.replace(/^---[\s\S]*?---\n?/, '');
        
        let htmlOutput = marked.parse(cleanText);

        // Prepend title as <h1> if markdown content doesn't already start with an h1 tag
        if (extractedTitle && !cleanText.trim().startsWith('# ')) {
          htmlOutput = `<h1>${extractedTitle}</h1>` + htmlOutput;
        }

        contentContainer.innerHTML = htmlOutput;
      } catch (error) {
        console.error('Error parsing markdown:', error);
        contentContainer.innerHTML = '<p>Error parsing article content.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadArticle);
  </script>

  <script src="nav.js"></script>



</body></html>
