<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter | Pabsmophobia</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="Pabsmo.jpg">
  <link rel="apple-touch-icon" href="Pabsmo.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Eczar:wght@400;600&amp;display=swap" rel="stylesheet">

  <!-- Marked.js Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Updated Stylesheet Link with Cache-Busting -->
  <link rel="stylesheet" href="styles.css?v=1.2">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="Pabsmo.jpg" alt="Pabsmophobia Logo" class="logo-img">
      <span>Pabsmophobia</span>
    </div>
    <!-- nav.js will populate menu items dynamically -->
    <nav></nav>
  </header>

  <main class="container">
    <a href="blog.html" class="read-more" style="display: inline-block; margin-bottom: 1.5rem;">← Back to Blogs &amp; Newsletters</a>
    
    <!-- Wrapped with article-card for dark background styling -->
    <article id="markdown-content" class="article-card">
      <p style="color: var(--text-muted);">Loading newsletter...</p>
    </article>
  </main>

  <footer>
    <p>© Pabsmophobia. All rights reserved.</p>
  </footer>

  <script>
    async function loadArticle() {
      const contentContainer = document.getElementById('markdown-content');
      const urlParams = new URLSearchParams(window.location.search);
      let fileParam = urlParams.get('file');

      // Fallback if no parameter is provided
      if (!fileParam) {
        fileParam = 'newsletter/monthly-haunt-issue1.md';
      }

      // Clean up parameter (decode, trim, and strip any accidental line numbers)
      fileParam = decodeURIComponent(fileParam).trim().replace(/:\d+$/, '');

      // Ensure the path automatically prepends 'newsletter/' if missing and doesn't start with http/root path
      if (!fileParam.startsWith('newsletter/') && !fileParam.startsWith('/')) {
        fileParam = 'newsletter/' + fileParam;
      }

      // Ensure the path is strictly relative (remove any accidental leading slash)
      let fetchPath = fileParam.startsWith('/') ? fileParam.substring(1) : fileParam;

      try {
        const response = await fetch(fetchPath);
        if (!response.ok) {
          throw new Error(`HTTP error ${response.status}`);
        }

        const rawText = await response.text();

        // Strip frontmatter metadata if present (--- title: ... ---)
        const cleanText = rawText.replace(/^---[\s\S]*?---\n?/, '');

        // Parse and inject Markdown content
        contentContainer.innerHTML = marked.parse(cleanText);

      } catch (error) {
        console.error('Error fetching markdown article from path:', fetchPath, error);
        contentContainer.innerHTML = '<p>Error loading article. Please verify the file path.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadArticle);
  </script>

  <!-- Dynamic Navigation Script -->
  <script src="nav.js"></script>



</body></html>
