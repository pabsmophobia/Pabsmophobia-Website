name: Normalize HTML Formatting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  format-html:
    runs-on: ubuntu-latest
    
    # Grants write permissions to commit changes back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install cheerio

      - name: Execute Normalization Script
        run: node .github/scripts/format-html.js

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-uniform CSS and HTML formatting"
