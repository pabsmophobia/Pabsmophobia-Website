name: Social Media Auto-Poster

on:
  workflow_dispatch:
  schedule:
    # Shifted off the top of the hour to prevent GitHub Actions cron queue delays
    - cron: '17 18 * * *'
  push:
    paths:
      - 'newsletter/**'
      - '.github/scripts/**'

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm install gray-matter

      - name: Build RSS Feed
        run: node generate-rss.js

      - name: Generate Blog Manifest
        run: node .github/scripts/generate-blog-index.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Run Social Poster
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TRIGGER_TYPE: ${{ github.event_name }}
        run: python post_social.py

      - name: Pull Latest Remote Changes
        run: |
          git config local.user.email "github-actions[bot]@users.noreply.github.com"
          git config local.user.name "github-actions[bot]"
          git stash
          git pull origin main --rebase
          git stash pop || true

      - name: Commit and Push All Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update feed, manifest, and social history [skip ci]"
          file_pattern: 'feed.xml newsletter-manifest.json posted_history.json'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
