name: Social Media Auto-Poster

on:
  workflow_dispatch: # Allows manual triggering from Actions tab
  schedule:
    # 10:00 AM UTC -> 10:00 AM GMT (Winter: late Oct to late March)
    - cron: '0 10 * * *'
    # 09:00 AM UTC -> 10:00 AM BST (Summer: late March to late Oct)
    - cron: '0 9 * * *'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Social Poster
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python post_social.py
