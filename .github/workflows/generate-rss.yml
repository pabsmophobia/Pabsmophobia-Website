name: Generate RSS Feed

on:
  push:
    paths:
      - 'newsletter/**'
      - '.github/scripts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install gray-matter

      - name: Build RSS Feed
        run: node generate-rss.js

      - name: Generate Blog Manifest
        run: node .github/scripts/generate-blog-index.js

      - name: Commit and Push Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate feed.xml and blog manifest from newsletter update [skip ci]"
          file_pattern: 'feed.xml newsletter-manifest.json'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
