name: Auto Post Blog Slides to TikTok

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'newsletter/*.md'

jobs:
  post-to-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Fonts, Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu ffmpeg
          pip install pillow markdown beautifulsoup4 requests

      - name: Render TikTok Slides
        run: python .github/scripts/generate_tiktok_slides.py

      - name: Convert Slides to Web-Compatible MP4 Video
        run: |
          ffmpeg -loop 1 -t 5 -i images/tiktok/slide_1.png -loop 1 -t 5 -i images/tiktok/slide_2.png \
            -filter_complex "[0:v][1:v]concat=n=2:v=1:a=0[v]" -map "[v]" \
            -c:v libx264 -preset fast -pix_fmt yuv420p -movflags +faststart \
            images/tiktok/slideshow.mp4 -y

      - name: Commit and Push Generated Video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/tiktok/*
          git diff --staged --quiet || git commit -m "build: generate tiktok video [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Publish Video via Postproxy API
        env:
          TIKTOK_KEY: ${{ secrets.TIKTOK_PUBLISH_KEY }}
          TIKTOK_PROFILE_ID: ${{ secrets.POSTPROXY_TIKTOK_PROFILE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python -c "
          import requests, os, sys, time, glob

          # Extract post content from the latest markdown file in /newsletter
          md_files = glob.glob('newsletter/*.md')
          post_text = 'New investigation notes live now. Read full details at pabsmophobia.com #paranormal #investigation #pabsmophobia'
          
          if md_files:
              latest_file = max(md_files, key=os.path.getmtime)
              with open(latest_file, 'r', encoding='utf-8') as f:
                  lines = [line.strip() for line in f.readlines() if line.strip()]
                  if lines:
                      # Grab first non-empty line as headline text
                      title = lines[0].replace('#', '').strip()
                      post_text = f'{title}\n\nRead full report at pabsmophobia.com #paranormal #investigation #pabsmophobia'

          video_url = f'https://pabsmophobia.com/images/tiktok/slideshow.mp4?v={os.environ[\"COMMIT_SHA\"]}'

          # Verify video URL returns 200 OK before sending payload to Postproxy
          print(f'Verifying accessibility of {video_url}...')
          for _ in range(12):
              check = requests.get(video_url)
              if check.status_code == 200 and len(check.content) > 1000:
                  print('Video verified and accessible.')
                  break
              print('Waiting for media host deployment...')
              time.sleep(10)

          url = 'https://api.postproxy.dev/api/posts'
          headers = {
              'Authorization': f'Bearer {os.environ[\"TIKTOK_KEY\"]}',
              'Content-Type': 'application/json'
          }
          payload = {
              'profiles': [os.environ['TIKTOK_PROFILE_ID']],
              'media': [video_url],
              'post': {
                  'body': post_text
              }
          }

          res = requests.post(url, json=payload, headers=headers, timeout=30)
          print('Postproxy API Response:', res.text)
          if not res.ok:
              sys.exit(1)
          "
