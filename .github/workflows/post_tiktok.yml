name: Auto Post Blog Slides to TikTok

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'newsletter/*.md'

jobs:
  post-to-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Fonts, Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu ffmpeg
          pip install pillow markdown beautifulsoup4 requests

      - name: Clean Stale Slide Cache
        run: rm -rf images/tiktok/*

      - name: Render TikTok Slides
        run: python .github/scripts/generate_tiktok_slides.py

      - name: Convert Slides to 9:16 Vertical MP4 Video
        run: |
          ffmpeg -loop 1 -t 5 -i images/tiktok/slide_1.png -loop 1 -t 5 -i images/tiktok/slide_2.png \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black[v0]; \
                             [1:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black[v1]; \
                             [v0][v1]concat=n=2:v=1:a=0[v]" -map "[v]" \
            -c:v libx264 -preset fast -pix_fmt yuv420p -movflags +faststart \
            images/tiktok/slideshow.mp4 -y

      - name: Commit and Push Generated Video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/tiktok/*
          git diff --staged --quiet || git commit -m "build: update tiktok slides video [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Publish Video via Postproxy API
        env:
          TIKTOK_KEY: ${{ secrets.TIKTOK_PUBLISH_KEY }}
          TIKTOK_PROFILE_ID: ${{ secrets.POSTPROXY_TIKTOK_PROFILE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python -c "
          import requests, os, sys, time, subprocess, re, glob

          post_text = 'New update live now. Check out full details at pabsmophobia.com #paranormal #investigation #pabsmophobia'
          latest_md = None

          try:
              git_cmd = ['git', 'log', '-n', '1', '--name-only', '--pretty=format:', '--', 'newsletter/*.md']
              output = subprocess.check_output(git_cmd).decode('utf-8').strip()
              files = [f.strip() for f in output.split('\n') if f.strip() and os.path.exists(f.strip())]
              if files:
                  latest_md = files[0]
          except Exception as e:
              print('Git log lookup failed:', e)

          if not latest_md:
              md_files = glob.glob('newsletter/*.md')
              if md_files:
                  latest_md = max(md_files, key=os.path.getmtime)

          if latest_md:
              print(f'Selected newsletter file: {latest_md}')
              with open(latest_md, 'r', encoding='utf-8') as f:
                  content = f.read()

              title_match = re.search(r'title:\s*[\"\\\']?(.*?)[\"\\\']?\s*$', content, re.MULTILINE)
              if title_match:
                  headline = title_match.group(1).strip()
              else:
                  clean_content = re.sub(r'^---[\s\S]*?---\s*', '', content).strip()
                  lines = [line.strip() for line in clean_content.split('\n') if line.strip()]
                  headline = lines[0].replace('#', '').strip() if lines else 'New Field Log'

              post_text = f'{headline}\n\nRead full report at pabsmophobia.com #paranormal #investigation #pabsmophobia'

          video_url = f'https://pabsmophobia.com/images/tiktok/slideshow.mp4?v={os.environ[\"COMMIT_SHA\"]}'

          print(f'Verifying video accessibility at {video_url}...')
          for _ in range(12):
              check = requests.get(video_url)
              if check.status_code == 200 and len(check.content) > 1000:
                  print('Video verified.')
                  break
              time.sleep(10)

          url = 'https://api.postproxy.dev/api/posts'
          headers = {
              'Authorization': f'Bearer {os.environ[\"TIKTOK_KEY\"]}',
              'Content-Type': 'application/json'
          }
          payload = {
              'profiles': [os.environ['TIKTOK_PROFILE_ID']],
              'media': [video_url],
              'post': {
                  'body': post_text
              }
          }

          res = requests.post(url, json=payload, headers=headers, timeout=30)
          print('Postproxy Response:', res.text)
          if not res.ok:
              sys.exit(1)
          "
