name: Auto Post Blog Slides to TikTok

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'newsletter/*.md'

jobs:
  post-to-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Fonts & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu
          pip install pillow markdown beautifulsoup4 requests

      - name: Render TikTok Slides
        run: python .github/scripts/generate_tiktok_slides.py

      - name: Commit and Push Generated Slides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/tiktok/*.png
          git diff --staged --quiet || git commit -m "build: generate tiktok slides [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Publish Photo Carousel via Postproxy API
        env:
          TIKTOK_KEY: ${{ secrets.TIKTOK_PUBLISH_KEY }}
        run: |
          python -c "
          import requests, os
          
          url = 'https://api.postproxy.dev/api/posts'
          headers = {
              'Authorization': f'Bearer {os.environ[\"TIKTOK_KEY\"]}',
              'Content-Type': 'application/json'
          }
          payload = {
              'post': {
                  'body': 'New investigation notes and field log live now. Read full details at pabsmophobia.com #paranormal #investigation #pabsmophobia',
                  'media_urls': [
                      'https://pabsmophobia.com/images/tiktok/slide_1.png',
                      'https://pabsmophobia.com/images/tiktok/slide_2.png'
                  ]
              }
          }
          
          res = requests.post(url, json=payload, headers=headers)
          print('Postproxy API Response:', res.json())
          "
