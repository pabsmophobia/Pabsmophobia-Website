name: Auto Post Blog Slides to TikTok

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'newsletter/*.md'

jobs:
  post-to-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Fonts, Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu ffmpeg
          pip install pillow markdown beautifulsoup4 requests

      - name: 1. Clean Stale Slide Cache (Cache Busting)
        run: |
          # Clears out old images so generator overwrites exact paths cleanly
          rm -rf images/tiktok/*

      - name: Render TikTok Slides
        run: python .github/scripts/generate_tiktok_slides.py

      - name: 2. Convert Slides to 9:16 Vertical MP4 Video (Forced Overwrite)
        run: |
          # Uses -y flag to forcibly overwrite slideshow.mp4 with newly rendered PNGs
          ffmpeg -loop 1 -t 5 -i images/tiktok/slide_1.png -loop 1 -t 5 -i images/tiktok/slide_2.png \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black[v0]; \
                             [1:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black[v1]; \
                             [v0][v1]concat=n=2:v=1:a=0[v]" -map "[v]" \
            -c:v libx264 -preset fast -pix_fmt yuv420p -movflags +faststart \
            images/tiktok/slideshow.mp4 -y

      - name: 3. Test with Artifact Uploads (Inspect Rendered Images)
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-slide-previews
          path: images/tiktok/*.png
          retention-days: 1

      - name: Commit and Push Generated Video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/tiktok/*
          git diff --staged --quiet || git commit -m "build: update tiktok slides video [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: 4. Verify Deployment Pipeline Order & Accessibility
        env:
          TIKTOK_KEY: ${{ secrets.TIKTOK_PUBLISH_KEY }}
          TIKTOK_PROFILE_ID: ${{ secrets.POSTPROXY_TIKTOK_PROFILE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: python .github/scripts/publish_tiktok.py
