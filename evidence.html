<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evidence &amp; Field Logs | Pabsmophobia</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="images/library/Pabsmo.jpg">
  <link rel="apple-touch-icon" href="images/library/Pabsmo.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Eczar:wght@400;600&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/library/Pabsmo.jpg" alt="Pabsmophobia Logo" class="logo-img">
      <span>Pabsmophobia</span>
    </div>
    <!-- nav.js will populate your menu items here dynamically -->
    <nav></nav>
  </header>

  <main class="container">
    <h1>Evidence &amp; Field Logs</h1>
    <p class="subtitle">Documented logs, sensor telemetry, and objective field analysis.</p>

    <!-- Filter Buttons -->
    <div class="filters" style="margin: 2rem 0; display: flex; gap: 0.5rem; flex-wrap: wrap;">
      <button class="filter-btn active" data-filter="all">All Files</button>
      <button class="filter-btn" data-filter="paranormal">Unexplained</button>
      <button class="filter-btn" data-filter="debunked">Debunked</button>
    </div>

    <!-- Dynamic Container for JSON Evidence Cards -->
    <div id="evidence-grid" class="grid-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
      <p>Loading case files...</p>
    </div>

  </main>

  <footer>
    <p>© Pabsmophobia. All rights reserved.</p>
  </footer>

  <!-- Dynamic Navigation & Evidence Rendering Scripts -->
  <script src="nav.js"></script>
  <script src="evidence.js"></script>



</body></html>
