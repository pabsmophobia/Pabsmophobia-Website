  <style>
    /* Filter Controls Styling */
    .filter-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      background-color: var(--card-bg, #121218);
      border: 1px solid var(--border, #2a2a38);
      border-radius: 8px;
      padding: 1.25rem;
      margin-top: 1.5rem;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .filter-group label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #9ca3af;
      font-weight: 600;
    }

    .filter-group select {
      background-color: #0d0d12;
      color: #fff;
      border: 1px solid var(--border, #2a2a38);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .filter-group select:focus {
      border-color: var(--accent, #8b5cf6);
    }

    .filter-actions {
      display: flex;
      align-items: flex-end;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border, #2a2a38);
      color: #9ca3af;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    /* Table & Event Card Specific Styles */
    .events-table-wrapper {
      overflow-x: auto;
      background-color: var(--card-bg, #121218);
      border: 1px solid var(--border, #2a2a38);
      border-radius: 8px;
      margin-top: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th, td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border, #2a2a38);
    }

    th {
      background-color: #0d0d12;
      color: #fff;
      font-family: var(--font-body, sans-serif);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    tr:hover {
      background-color: rgba(139, 92, 246, 0.05);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .event-title {
      color: #fff;
      font-weight: 600;
    }

    .booking-cell {
      white-space: nowrap;
    }

    .col-date { white-space: nowrap; font-weight: 600; color: var(--accent, #8b5cf6); }
    .col-price { color: #f3f4f6; }

    /* Badge Styles */
    .badge-pabs {
      background: rgba(139, 92, 246, 0.25);
      color: #c084fc;
      border: 1px solid rgba(139, 92, 246, 0.6);
      box-shadow: 0 0 6px rgba(139, 92, 246, 0.3);
    }

    .no-results {
      text-align: center;
      padding: 2rem;
      color: #9ca3af;
    }
  </style>
</head>

  <main class="container" style="max-width: 1100px;">

    <!-- Interactive Filters -->
    <div class="filter-container">

        </select>
      </div>

      <div class="filter-group">
        <label for="filterType">Event Type</label>

        </select>
      </div>

      <div class="filter-group">
        <label for="filterLocation">Location</label>
        <select id="filterLocation">

        </select>
      </div>

      <div class="filter-group">
        <label for="filterVenue">Venue</label>
        <select id="filterVenue">
          <option value="ALL">All Venues</option>
        </select>
      </div>

      <div class="filter-actions">
        <button class="btn-reset" onclick="resetFilters()">Reset Filters</button>
      </div>
    </div>

    <!-- Table Wrapper -->
    <div class="events-table-wrapper">
      <table>

          <tr>

            <th>Event Name</th>
            <th>Provider</th>
            <th>Venue</th>

            <th>Action</th>
          </tr>
        </thead>
        <tbody id="eventsTableBody">
          <!-- Dynamically Rendered -->
        </tbody>
      </table>
    </div>
  </main>

      { date: '05/09/2026', name: 'Woodchester Mansion Ghost Hunt', provider: 'Haunting Nights', venue: 'Woodchester Mansion', location: 'Gloucestershire', type: 'Ghost Hunt', time: '21:00 - 03:00', price: '10 Places Available', providerType: 'hn', coHost: true },
      { date: '05/09/2026', name: 'Willsbridge Mill Ghost Hunt', provider: 'Haunting Nights', venue: 'Willsbridge Mill', location: 'Bristol, Gloucestershire', type: 'Ghost Hunt', time: '21:00 - 02:00', price: '£39.00 (10 Places)', providerType: 'hn', coHost: true },
      { date: '11/09/2026', name: 'Hell Fire Caves Ghost Hunt', provider: 'Haunting Nights', venue: 'Hellfire Caves', location: 'West Wycombe', type: 'Ghost Hunt', time: '20:00 - 02:00', price: 'Limited Places Available', providerType: 'hn', coHost: false },
      { date: '12/09/2026', name: 'Ripon Workhouse Ghost Hunt', provider: 'Haunting Nights', venue: 'Ripon Workhouse', location: 'North Yorkshire', type: 'Ghost Hunt', time: '20:00 - 02:00', price: 'Limited Places Available', providerType: 'hn', coHost: false },
      { date: '01/10/2026', name: 'The Horseshoe - In-spectre nights', provider: 'Pabsmophobia', venue: 'The Horseshoe', location: 'Chipping Sodbury', type: 'Ghost Hunt', time: '20:00 - 23:00', price: 'Full details coming soon. Sundays through October.', providerType: 'pabs', coHost: false },
      { date: '24/10/2026', name: 'The Old Prison Halloween Ghost Hunt', provider: 'Haunting Nights', venue: 'The Old Prison', location: 'Northleach, Gloucestershire', type: 'Ghost Hunt', time: '20:00 - 02:00', price: '£49.00 (Last 6 Places)', providerType: 'hn', coHost: true }
    ];

    const elProvider = document.getElementById('filterProvider');
    const elType = document.getElementById('filterType');
    const elLocation = document.getElementById('filterLocation');
    const elVenue = document.getElementById('filterVenue');
    const tbody = document.getElementById('eventsTableBody');

    function populateFilterDropdowns() {
      const providers = new Set();
      const types = new Set();
      const locations = new Set();
      const venues = new Set();

      eventData.forEach(item => {
        if (item.provider) providers.add(item.provider);
        if (item.type) types.add(item.type);
        if (item.location) locations.add(item.location);
        if (item.venue) venues.add(item.venue);
      });

      appendOptions(elProvider, Array.from(providers).sort());
      appendOptions(elType, Array.from(types).sort());
      appendOptions(elLocation, Array.from(locations).sort());
      appendOptions(elVenue, Array.from(venues).sort());
    }

    function appendOptions(selectEl, items) {
      items.forEach(val => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = val;
        selectEl.appendChild(opt);
      });
    }

    function renderTable() {
      const selectedProvider = elProvider.value;
      const selectedType = elType.value;
      const selectedLocation = elLocation.value;
      const selectedVenue = elVenue.value;

      tbody.innerHTML = '';

      const filtered = eventData.filter(item => {
        const matchProvider = (selectedProvider === 'ALL' || item.provider === selectedProvider);
        const matchType = (selectedType === 'ALL' || item.type === selectedType);
        const matchLocation = (selectedLocation === 'ALL' || item.location === selectedLocation);
        const matchVenue = (selectedVenue === 'ALL' || item.venue === selectedVenue);

        return matchProvider && matchType && matchLocation && matchVenue;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="no-results">No events match your selected filters.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        
        let badgesHTML = '';
        if (item.providerType === 'pabs') {
          badgesHTML = `<span class="badge badge-pabs">Pabsmophobia</span>`;
        } else if (item.providerType === 'hn') {
          badgesHTML = `<span class="badge badge-hn">Haunting Nights</span>`;
        } else {
          badgesHTML = `<span class="badge badge-ram">The Ancient Ram Inn</span>`;
        }

        if (item.coHost) {
          badgesHTML += ` <span class="badge badge-pabs">Co-Host</span>`;
        }

        tr.innerHTML = `
          <td class="col-date">${item.date}</td>
          <td class="event-title">${item.name}</td>
          <td>${badgesHTML}</td>
          <td>${item.venue}</td>
          <td>${item.location}</td>
          <td>${item.type}</td>
          <td style="white-space: nowrap;">${item.time}</td>
          <td class="col-price">${item.price}</td>
          <td class="booking-cell">
            <button class="btn" onclick="openBookingForm('${item.name.replace(/'/g, "\\'")}', '${item.date}')">Inquire</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function resetFilters() {
      elProvider.value = 'ALL';
      elType.value = 'ALL';
      elLocation.value = 'ALL';
      elVenue.value = 'ALL';
      renderTable();
    }

    function openBookingForm(eventName, eventDate) {
      const googleFormBaseURL = "https://docs.google.com/forms/d/e/YOUR_FORM_ID/viewform";
      const entryID = "entry.123456789"; 
      const fullQuery = `${googleFormBaseURL}?usp=pp_url&${entryID}=${encodeURIComponent(eventName + ' (' + eventDate + ')')}`;
      window.open(fullQuery, '_blank');
    }

    // Attach listeners
    [elProvider, elType, elLocation, elVenue].forEach(select => {
      select.addEventListener('change', renderTable);
    });

    // Init
    populateFilterDropdowns();
    renderTable();
  </script>
