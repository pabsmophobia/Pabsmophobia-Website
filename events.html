<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investigation Schedule | Pabsmophobia</title>

  <!-- OpenGraph / Social Media Previews -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pabsmophobia.com/events">
  <meta property="og:title" content="Investigation Schedule | Pabsmophobia">
  <meta property="og:description" content="View upcoming ghost hunts, overnight paranormal investigations, and partner events. Find dates, venues, and inquiry details.">
  <meta property="og:image" content="https://pabsmophobia.com/images/library/Pabsmo.jpg">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://pabsmophobia.com/events">
  <meta name="twitter:title" content="Investigation Schedule | Pabsmophobia">
  <meta name="twitter:description" content="View upcoming ghost hunts, overnight paranormal investigations, and partner events. Find dates, venues, and inquiry details.">
  <meta name="twitter:image" content="https://pabsmophobia.com/images/library/Pabsmo.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="images/library/Pabsmo.jpg">
  <link rel="apple-touch-icon" href="images/library/Pabsmo.jpg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&amp;family=Eczar:wght@400;600&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body, main, .container {
      max-width: 100vw !important;
      overflow-x: hidden;
    }

    /* Desktop Table Wrapper */
    .events-table-wrapper {
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      margin-top: 1.5rem;
      border: 1px solid var(--border, #334155);
      border-radius: 8px;
      background: var(--bg-card, #1e293b);
      display: block !important;
    }

    .events-table-wrapper table {
      width: 100% !important;
      min-width: 900px !important;
      border-collapse: collapse;
      font-size: 0.95rem;
      table-layout: auto !important;
    }

    .events-table-wrapper th, 
    .events-table-wrapper td {
      padding: 0.75rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid var(--border, #334155);
      white-space: nowrap !important;
    }

    .events-table-wrapper th {
      background: rgba(0,0,0,0.4);
      color: var(--accent, #a855f7);
      font-family: 'Eczar', serif;
    }

    .events-table-wrapper td:last-child, 
    .events-table-wrapper th:last-child {
      text-align: center;
      min-width: 110px;
    }

    /* Mobile Cards Container (Hidden by default on desktop) */
    .events-cards-mobile {
      display: none;
    }

    /* Responsive Breakpoint for Mobile Cards (< 768px) */
    @media (max-width: 768px) {
      .events-table-wrapper {
        display: none !important;
      }
      .events-cards-mobile {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .event-card {
        background: var(--bg-card, #1e293b);
        border: 1px solid var(--border, #334155);
        border-radius: 8px;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .event-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
      }
      .event-card-title {
        font-size: 1.1rem;
        font-weight: bold;
        color: #fff;
        margin: 0;
      }
      .event-card-date {
        font-size: 0.9rem;
        color: var(--accent, #a855f7);
        font-family: 'Eczar', serif;
        white-space: nowrap;
      }
      .event-card-details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: var(--text-muted, #9ca3af);
      }
      .event-card-details div span {
        color: #fff;
        font-weight: 500;
      }
      .event-card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.25rem;
        padding-top: 0.75rem;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
      .event-price {
        font-weight: 600;
        color: #34d399;
      }
    }

    /* Badges & Disclaimers */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-pabs { background: #7c3aed; color: #fff; }
    .badge-hn { background: #0284c7; color: #fff; }
    .badge-ram { background: #d97706; color: #fff; }
    
    .disclaimer-box {
      background: rgba(168, 85, 247, 0.1);
      border-left: 4px solid var(--accent, #a855f7);
      padding: 1rem;
      border-radius: 4px;
      margin: 1.5rem 0;
      font-size: 0.9rem;
    }

    .filter-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .filter-group label {
      font-size: 0.8rem;
      color: var(--text-muted, #9ca3af);
    }
    .filter-group select {
      padding: 0.4rem 0.6rem;
      background: var(--bg-card, #1e293b);
      color: #fff;
      border: 1px solid var(--border, #334155);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/library/Pabsmo.jpg" alt="Pabsmophobia Logo" class="logo-img">
      <span>Pabsmophobia</span>
    </div>
    <nav></nav>
  </header>

  <main class="container">
    <h1>Investigation Schedule</h1>
    <p class="subtitle">Upcoming ghost hunts, overnight investigations, and partner events.</p>

    <!-- Filters -->
    <div class="filter-container">
      <div class="filter-group">
        <label for="filterProvider">Provider</label>
        <select id="filterProvider"><option value="ALL">All Providers</option></select>
      </div>

      <div class="filter-group">
        <label for="filterType">Event Type</label>
        <select id="filterType"><option value="ALL">All Types</option></select>
      </div>

      <div class="filter-group">
        <label for="filterLocation">Location</label>
        <select id="filterLocation"><option value="ALL">All Locations</option></select>
      </div>

      <div class="filter-group">
        <label for="filterVenue">Venue</label>
        <select id="filterVenue"><option value="ALL">All Venues</option></select>
      </div>

      <div class="filter-actions" style="align-self: flex-end;">
        <button class="btn-reset" onclick="resetFilters()" style="padding: 0.4rem 0.8rem; cursor: pointer;">Reset Filters</button>
      </div>
    </div>

    <!-- Desktop Table Wrapper -->
    <div class="events-table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Event Name</th>
            <th>Provider</th>
            <th>Venue</th>
            <th>Location</th>
            <th>Type</th>
            <th>Time</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="eventsTableBody">
          <tr>
            <td colspan="9" style="text-align:center; padding: 2rem; color:#9ca3af;">Loading live schedule...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Mobile Cards Container -->
    <div id="eventsCardsContainer" class="events-cards-mobile">
      <div style="text-align:center; padding: 2rem; color:#9ca3af;">Loading live schedule...</div>
    </div>
  </main>

  <footer>
    <p style="text-align: center; color: #9ca3af; margin-top: 3rem;">© Pabsmophobia. All rights reserved.</p>
  </footer>

  <script>
    const JSON_DATA_URL = 'data.json';

    let eventData = [];

    const elProvider = document.getElementById('filterProvider');
    const elType = document.getElementById('filterType');
    const elLocation = document.getElementById('filterLocation');
    const elVenue = document.getElementById('filterVenue');
    const tbody = document.getElementById('eventsTableBody');
    const cardsContainer = document.getElementById('eventsCardsContainer');

    function parseDate(dateStr) {
      if (!dateStr) return new Date(0);
      const cleanDate = dateStr.replace(/st|nd|rd|th/g, '');
      const parsed = Date.parse(cleanDate);
      return !isNaN(parsed) ? new Date(parsed) : new Date(0);
    }

    async function fetchLiveEvents() {
      try {
        const response = await fetch(JSON_DATA_URL);
        if (!response.ok) throw new Error('Network response was not ok');
        const jsonData = await response.json();

        const rawEvents = jsonData.map(item => ({
          date: item["Date"] || 'TBA',
          name: item["Event Name"] || 'Paranormal Investigation',
          provider: item["Provider"] || 'Partner Event',
          venue: item["Event Venue"] || 'Location Pending',
          location: item["Location"] || 'UK Venue',
          type: item["Event Type"] || 'Ghost Hunt',
          time: item["Time"] || 'See Provider',
          price: item["Price / Availability"] || 'See Provider',
          providerType: (item["Provider"] || '').toLowerCase()
        }));

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        eventData = rawEvents
          .filter(item => item.date !== 'TBA' && parseDate(item.date) >= today)
          .sort((a, b) => parseDate(a.date) - parseDate(b.date));

        populateFilterDropdowns();
        renderTable();
        injectEventSchema(eventData); 
      } catch (err) {
        console.error('Error fetching data.json schedule:', err);
        const errMsg = `<div style="text-align:center; padding: 2rem; color:#f87171;">Failed to load schedule. Please check back later.</div>`;
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 2rem; color:#f87171;">Failed to load schedule.</td></tr>`;
        cardsContainer.innerHTML = errMsg;
      }
    }

    // Dynamic JSON-LD Injector for Search Engines
    function injectEventSchema(events) {
      const existingScript = document.getElementById('dynamic-event-schema');
      if (existingScript) existingScript.remove();

      const schemaList = events.map(item => {
        const dObj = parseDate(item.date);
        const isoDate = !isNaN(dObj.getTime()) ? dObj.toISOString() : new Date().toISOString();

        return {
          "@type": "Event",
          "name": item.name,
          "startDate": isoDate,
          "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
          "eventStatus": "https://schema.org/EventScheduled",
          "location": {
            "@type": "Place",
            "name": item.venue,
            "address": {
              "@type": "PostalAddress",
              "addressLocality": item.location,
              "addressCountry": "GB"
            }
          },
          "organizer": {
            "@type": "Organization",
            "name": item.provider,
            "url": "https://pabsmophobia.com"
          },
          "offers": {
            "@type": "Offer",
            "price": item.price.replace(/[^0-9.]/g, '') || "0.00",
            "priceCurrency": "GBP",
            "availability": "https://schema.org/InStock",
            "url": "https://pabsmophobia.com/events"
          }
        };
      });

      const script = document.createElement('script');
      script.id = 'dynamic-event-schema';
      script.type = 'application/ld+json';
      script.text = JSON.stringify({
        "@context": "https://schema.org",
        "@graph": schemaList
      });
      document.head.appendChild(script);
    }

    function populateFilterDropdowns() {
      const providers = new Set(), types = new Set(), locations = new Set(), venues = new Set();
      
      eventData.forEach(item => {
        if (item.provider && item.provider !== 'Partner Event') providers.add(item.provider);
        if (item.type) types.add(item.type);
        if (item.location && item.location !== 'UK Venue') locations.add(item.location);
        if (item.venue && item.venue !== 'Location Pending') venues.add(item.venue);
      });

      appendOptions(elProvider, Array.from(providers).sort());
      appendOptions(elType, Array.from(types).sort());
      appendOptions(elLocation, Array.from(locations).sort());
      appendOptions(elVenue, Array.from(venues).sort());
    }

    function appendOptions(selectEl, items) {
      items.forEach(val => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = val;
        selectEl.appendChild(opt);
      });
    }

    function renderTable() {
      const selectedProvider = elProvider.value;
      const selectedType = elType.value;
      const selectedLocation = elLocation.value;
      const selectedVenue = elVenue.value;

      tbody.innerHTML = '';
      cardsContainer.innerHTML = '';

      const filtered = eventData.filter(item => {
        return (selectedProvider === 'ALL' || item.provider === selectedProvider) &&
               (selectedType === 'ALL' || item.type === selectedType) &&
               (selectedLocation === 'ALL' || item.location === selectedLocation) &&
               (selectedVenue === 'ALL' || item.venue === selectedVenue);
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 2rem; color:#9ca3af;">No upcoming events match your selected filters.</td></tr>`;
        cardsContainer.innerHTML = `<div style="text-align:center; padding: 2rem; color:#9ca3af;">No upcoming events match your selected filters.</div>`;
        return;
      }

      filtered.forEach(item => {
        const pType = (item.providerType || '').toLowerCase().trim();
        const pName = (item.provider || '').toLowerCase().trim();

        let badgeClass = 'badge-hn';
        let resolvedType = 'hn';

        if (pType.includes('pabs') || pName.includes('pabs')) {
          badgeClass = 'badge-pabs';
          resolvedType = 'pabs';
        } else if (pType.includes('ram') || pName.includes('ram') || pName.includes('ancient ram')) {
          badgeClass = 'badge-ram';
          resolvedType = 'ram';
        }

        let badgesHTML = `<span class="badge ${badgeClass}">${item.provider}</span>`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.date}</td>
          <td><strong>${item.name}</strong></td>
          <td>${badgesHTML}</td>
          <td>${item.venue}</td>
          <td>${item.location}</td>
          <td>${item.type}</td>
          <td>${item.time}</td>
          <td>${item.price}</td>
          <td><button class="btn" style="padding: 0.3rem 0.8rem; font-size: 0.85rem;" onclick="handleInquiry('${resolvedType}', '${item.name.replace(/'/g, "\\'")}', '${item.date}')">Inquire</button></td>
        `;
        tbody.appendChild(tr);

        const card = document.createElement('div');
        card.className = 'event-card';
        card.innerHTML = `
          <div class="event-card-header">
            <h3 class="event-card-title">${item.name}</h3>
            <span class="event-card-date">${item.date}</span>
          </div>
          <div>${badgesHTML}</div>
          <div class="event-card-details">
            <div>Venue: <span>${item.venue}</span></div>
            <div>Location: <span>${item.location}</span></div>
            <div>Type: <span>${item.type}</span></div>
            <div>Time: <span>${item.time}</span></div>
          </div>
          <div class="event-card-footer">
            <span class="event-price">${item.price}</span>
            <button class="btn" style="padding: 0.4rem 1rem; font-size: 0.9rem;" onclick="handleInquiry('${resolvedType}', '${item.name.replace(/'/g, "\\'")}', '${item.date}')">Inquire</button>
          </div>
        `;
        cardsContainer.appendChild(card);
      });
    }

    function resetFilters() {
      elProvider.value = 'ALL';
      elType.value = 'ALL';
      elLocation.value = 'ALL';
      elVenue.value = 'ALL';
      renderTable();
    }

    function handleInquiry(providerType, eventName, eventDate) {
      if (providerType === 'ram') {
        window.open('https://ancientraminn.co.uk/events/', '_blank');
      } else if (providerType === 'hn') {
        window.open('https://hauntingnights.co.uk/ghost-hunts/', '_blank');
      } else {
        const googleFormBaseURL = "https://docs.google.com/forms/d/e/1FAIpQLScBWQ4Vw5OzlGSav07EIQsSTlUNy6_OayTkYy1ltcbyyu5OdA/viewform";
        const entryID = "entry.1202371367"; 
        const eventDetail = `${eventName} (${eventDate})`;
        
        window.open(`${googleFormBaseURL}?usp=pp_url&${entryID}=${encodeURIComponent(eventDetail)}`, '_blank');
      }
    }

    [elProvider, elType, elLocation, elVenue].forEach(select => select.addEventListener('change', renderTable));

    fetchLiveEvents();
  </script>

  <script src="nav.js"></script>



</body></html>
