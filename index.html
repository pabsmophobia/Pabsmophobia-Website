<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pabsmophobia - Paranormal Research &amp; Investigations</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #111827;
      --border: #1f2937;
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --text: #f8fafc;
      --text-muted: #9ca3af;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge-paranormal { background: #581c87; color: #e9d5ff; }
    .badge-debunked { background: #374151; color: #d1d5db; }
    .badge-pabs { background: #065f46; color: #a7f3d0; }
    .badge-hn { background: #1e3a8a; color: #bfdbfe; }
    .badge-ram { background: #991b1b; color: #fecaca; }

    .btn {
      background: #8b5cf6;
      color: #fff;
      border: none;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    
    <!-- Latest Field Evidence Section -->
    <section>
      <h2>Latest Field Evidence</h2>
      <div id="latest-investigations-container" class="grid">
        <p style="color: var(--text-muted); grid-column: 1 / -1;">Loading field telemetry...</p>
      </div>
    </section>

    <!-- Upcoming Investigations Section -->
    <section>
      <h2>Upcoming Investigations</h2>
      <div id="homepageEventsGrid" class="grid">
        <p style="color: var(--text-muted); grid-column: 1 / -1;">Loading upcoming events...</p>
      </div>
    </section>

  </div>

  <!-- Load Latest Field Evidence Live from YouTube API -->
  <script>
    async function loadLatestInvestigations() {
      const container = document.getElementById('latest-investigations-container');
      const PLAYLIST_ID = 'PLEj-QWD6H1U';
      
      // Replace with your valid Google YouTube Data API Key
      const YOUTUBE_API_KEY = window.PABS_YOUTUBE_API_KEY || 'YOUR_ACTIVE_API_KEY';

      if (YOUTUBE_API_KEY === 'YOUR_ACTIVE_API_KEY') {
        container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1;">Unable to load recent field logs. (API key missing)</p>';
        return;
      }

      const endpoint = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=10&playlistId=${PLAYLIST_ID}&key=${YOUTUBE_API_KEY}&_cb=${Date.now()}`;

      try {
        const response = await fetch(endpoint);
        const data = await response.json();

        if (!response.ok) throw new Error(data.error?.message || 'API fetch failed');

        const items = data.items || [];
        const validItems = items.filter(item => 
          item.snippet && 
          item.snippet.title !== 'Private video' && 
          item.snippet.title !== 'Deleted video'
        );

        if (validItems.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1;">No recent field logs found.</p>';
          return;
        }

        const latest = validItems.slice(0, 3);

        container.innerHTML = latest.map(item => {
          const snippet = item.snippet;
          const description = snippet.description || '';

          let status = 'paranormal';
          if (description.toLowerCase().includes('#status:debunked') || description.toLowerCase().includes('#debunked')) {
            status = 'debunked';
          }

          let location = 'Field Telemetry';
          const locTagMatch = description.match(/#loc:([^\r\n#]+)/i);
          const locColonMatch = description.match(/Location:\s*([^\r\n#]+)/i);

          if (locTagMatch && locTagMatch[1]) {
            location = locTagMatch[1].trim();
          } else if (locColonMatch && locColonMatch[1]) {
            location = locColonMatch[1].trim();
          }

          const statusClass = status === 'debunked' ? 'badge-debunked' : 'badge-paranormal';
          const statusLabel = status === 'debunked' ? 'Debunked' : 'Unexplained';

          const formattedDate = snippet.publishedAt ? new Date(snippet.publishedAt).toLocaleDateString('en-GB', {
            day: 'numeric',
            month: 'short',
            year: 'numeric'
          }) : '';

          return `
            <div style="background: var(--card-bg); padding: 1.25rem; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                  <span class="badge ${statusClass}">${statusLabel}</span>
                  <span style="font-size: 0.8rem; color: var(--text-muted);">${formattedDate}</span>
                </div>
                <h3 style="margin: 0 0 0.5rem 0; color: #fff; font-size: 1.1rem;">${snippet.title}</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.75rem;">📍 ${location}</p>
                <p style="color: var(--text-muted); line-height: 1.4; font-size: 0.85rem;">${description.length > 140 ? description.substring(0, 140) + '...' : description}</p>
              </div>
              <a href="evidence.html" style="color: var(--accent); text-decoration: none; font-weight: 600; margin-top: 1rem; display: inline-block;">View Log →</a>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Error loading latest YouTube evidence:', err);
        container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1;">Unable to load recent field logs.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadLatestInvestigations);
  </script>

  <!-- Live Google Sheet Homepage Events Widget Script -->
  <script>
    (function() {
      const WIDGET_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQg_l7qnk1kof0lZhIqP0BSNjOfsS5F0MVB92p56wrIzgdSGOKUfxpK-Ec8FMq3uTePGnAs6jF_aIDD/pub?gid=0&single=true&output=csv';
      const gridContainer = document.getElementById('homepageEventsGrid');

      function parseWidgetDate(dateStr) {
        if (!dateStr) return new Date(0);
        const cleanStr = dateStr.replace(/(st|nd|rd|th)/gi, '');
        const parsed = new Date(cleanStr);
        if (!isNaN(parsed.getTime())) return parsed;

        const parts = dateStr.split('/');
        if (parts.length === 3) {
          const [day, month, year] = parts.map(p => parseInt(p, 10));
          return new Date(year, month - 1, day);
        }
        return new Date(0);
      }

      function parseWidgetCSV(text) {
        const lines = [];
        let row = [];
        let inQuotes = false;
        let currentVal = '';

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const nextChar = text[i + 1];

          if (char === '"') {
            if (inQuotes && nextChar === '"') {
              currentVal += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            row.push(currentVal.trim());
            currentVal = '';
          } else if ((char === '\r' || char === '\n') && !inQuotes) {
            if (char === '\r' && nextChar === '\n') i++;
            row.push(currentVal.trim());
            if (row.some(val => val.length > 0)) lines.push(row);
            row = [];
            currentVal = '';
          } else {
            currentVal += char;
          }
        }
        if (currentVal.length > 0 || row.length > 0) {
          row.push(currentVal.trim());
          lines.push(row);
        }
        return lines;
      }

      function handleWidgetInquiry(providerType, eventName, eventDate) {
        if (providerType === 'ram') {
          window.open('https://ancientraminn.co.uk/events/', '_blank');
        } else if (providerType === 'hn') {
          window.open('https://hauntingnights.co.uk/ghost-hunts/', '_blank');
        } else {
          const googleFormBaseURL = "https://docs.google.com/forms/d/e/1FAIpQLScBWQ4Vw5OzlGSav07EIQsSTlUNy6_OayTkYy1ltcbyyu5OdA/viewform";
          const entryID = "entry.1202371367"; 
          const eventDetail = `${eventName} (${eventDate})`;
          window.open(`${googleFormBaseURL}?usp=pp_url&${entryID}=${encodeURIComponent(eventDetail)}`, '_blank');
        }
      }

      async function loadWidgetEvents() {
        try {
          const response = await fetch(WIDGET_SHEET_URL);
          if (!response.ok) throw new Error('Fetch failed');
          const csvText = await response.text();
          const parsedRows = parseWidgetCSV(csvText);

          const rows = parsedRows.slice(1);
          const today = new Date();
          today.setHours(0, 0, 0, 0);

          let events = rows.map(cols => ({
            date: cols[0] || 'TBA',
            name: cols[1] || 'Paranormal Investigation',
            provider: cols[2] || 'Partner Event',
            venue: cols[3] || 'Location Pending',
            location: cols[4] || 'UK Venue',
            type: cols[5] || 'Ghost Hunt',
            time: cols[6] || 'See Provider',
            price: cols[7] || 'See Provider',
            providerType: (cols[8] || '').toLowerCase(),
            coHost: (cols[9] || '').toLowerCase() === 'true'
          }))
          .filter(item => item.date !== 'TBA');

          // Sort by date ascending to show immediate upcoming events
          events.sort((a, b) => parseWidgetDate(a.date) - parseWidgetDate(b.date));
          events = events.slice(0, 4);

          if (events.length === 0) {
            gridContainer.innerHTML = `<div style="text-align: center; padding: 2rem; color: #9ca3af; grid-column: 1 / -1;">No upcoming investigations scheduled right now.</div>`;
            return;
          }

          gridContainer.innerHTML = '';
          events.forEach(item => {
            const pType = (item.providerType || '').toLowerCase().trim();
            const pName = (item.provider || '').toLowerCase().trim();

            let badgeClass = 'badge-hn';
            let resolvedType = pType || 'hn';

            if (pType === 'pabs' || pName.includes('pabs')) {
              badgeClass = 'badge-pabs';
              resolvedType = 'pabs';
            } else if (pType === 'ram' || pName.includes('ram')) {
              badgeClass = 'badge-ram';
              resolvedType = 'ram';
            }

            let badgesHTML = `<span class="badge ${badgeClass}">${item.provider}</span>`;
            if (item.coHost) badgesHTML += ` <span class="badge badge-pabs">Co-Host</span>`;

            const card = document.createElement('div');
            card.style.cssText = "background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; gap: 0.75rem;";
            
            card.innerHTML = `
              <div>
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.5rem;">
                  <h3 style="margin: 0; font-size: 1.05rem; font-weight: bold; color: #fff; line-height: 1.3;">${item.name}</h3>
                  <span style="font-size: 0.8rem; color: #c084fc; font-weight: bold; white-space: nowrap;">${item.date}</span>
                </div>
                <div style="margin-bottom: 0.75rem;">${badgesHTML}</div>
                <div style="font-size: 0.85rem; color: #9ca3af; line-height: 1.4;">
                  <div><strong>Venue:</strong> ${item.venue}</div>
                  <div><strong>Location:</strong> ${item.location}</div>
                </div>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 0.75rem; margin-top: 0.25rem;">
                <span style="font-weight: 600; color: #34d399; font-size: 0.9rem;">${item.price}</span>
                <button class="btn" onclick="handleWidgetInquiry('${resolvedType}', '${item.name.replace(/'/g, "\\'")}', '${item.date}')">Inquire</button>
              </div>
            `;
            gridContainer.appendChild(card);
          });

        } catch (err) {
          console.error('Widget error:', err);
          gridContainer.innerHTML = `<div style="text-align: center; padding: 1rem; color: #f87171; grid-column: 1 / -1;">Unable to load upcoming events right now.</div>`;
        }
      }

      window.handleWidgetInquiry = handleWidgetInquiry;
      document.addEventListener('DOMContentLoaded', loadWidgetEvents);
    })();
  </script>


</body></html>
